stages:
  data_ingestion:
    cmd: python src/CNNClassifier/pipeline/stage_1_data_ingestion.py
    deps:
      - src/CNNClassifier/pipeline/stage_1_data_ingestion.py
      - config/config.yaml
    outs:
      - artifacts/data_ingestion/Chicken-fecal-images


  prepare_base_model:
    cmd: python src/CNNClassifier/pipeline/stage_2_prep_base_model_trainer.py
    deps:
      - src/CNNClassifier/pipeline/stage_2_prep_base_model_trainer.py
      - config/config.yaml
    params:
      - IMAGE_SIZE
      - INCLUDE_TOP
      - CLASSES
      - WEIGHTS
      - LEARNING_RATE
    outs:
      - artifacts/prepare_base_model



  training:
    cmd: python src/CNNClassifier/pipeline/stage_3_model_training.py
    deps:
      - src/CNNClassifier/pipeline/stage_3_model_training.py
      - src/CNNClassifier/components/prep_callbacks.py
      - config/config.yaml
      - artifacts/data_ingestion/Chicken-fecal-images
      - artifacts/prepare_base_model
    params:
      - IMAGE_SIZE
      - EPOCHS
      - BATCH_SIZE
      - AUGMENTATION
    outs:
      - artifacts/training/model.h5


  

  evaluation:
    cmd: python src/CNNClassifier/pipeline/stage_4_model_eval.py
    deps:
      - src/CNNClassifier/pipeline/stage_4_model_eval.py
      - config/config.yaml
      - artifacts/data_ingestion/Chicken-fecal-images
      - artifacts/training/model.h5
    params:
      - IMAGE_SIZE
      - BATCH_SIZE
    metrics:
    - scores.json:
        cache: false
